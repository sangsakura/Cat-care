<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>咕噜开罐计划</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5fc;color:#252232;font-family:-apple-system,"PingFang SC",sans-serif;padding-bottom:78px}.hero{padding:50px 20px 30px;color:#fff;background:linear-gradient(135deg,#745bd6,#ab8ee8);border-radius:0 0 28px 28px}.hero h1{margin:0;font-size:32px}.wrap{padding:16px;max-width:720px;margin:auto}.panel{background:#fff;border-radius:22px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;background:#f8f6ff;border-radius:16px;padding:12px;margin:10px 0;width:100%;overflow:hidden}.pic{width:76px;height:76px;object-fit:cover;border-radius:13px;border:1px solid #e1daee;background:#fff}.title{font-size:17px;font-weight:800;line-height:1.4;overflow-wrap:anywhere}.meta{font-size:13px;color:#777083;line-height:1.5}.qty{font-size:22px;font-weight:800}.page{display:none}.page.on{display:block}.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #e5e0ed}.tabs button{border:0;background:#fff;padding:10px;color:#746e7b}.tabs button.on{color:#624ec7;font-weight:800}.tabs span{display:block;font-size:22px}.upload{font-size:12px;color:#624ec7;font-weight:700}.notice{background:#fff3dc;border-left:5px solid #efa22c;border-radius:10px;padding:12px;font-size:13px;line-height:1.5}input,select{width:100%;padding:12px;border:1px solid #ddd6e9;border-radius:12px;font-size:16px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}@media(max-width:360px){.row{grid-template-columns:60px minmax(0,1fr) auto}.pic{width:60px;height:60px}}</style><header class="hero"><h1>🐱 咕噜开罐计划</h1><p id="date"></p></header><main class="wrap"><section id="todayPage" class="page on"><div class="panel"><h2>今天</h2><div id="today"></div></div><div class="notice">保留单列布局。已核对SKU使用本地识别图，其他商品显示本地占位图。库存页可为任意SKU上传实拍图。</div></section><section id="planPage" class="page"><div class="panel"><h2>未来7天</h2><div id="plan"></div></div></section><section id="stockPage" class="page"><div class="panel"><h2>图片库存</h2><input id="q" placeholder="搜索商品" oninput="stockRender()"><div class="filters"><select id="gf" onchange="stockRender()"><option value="">全部等级</option><option>G1</option><option>G2</option><option>G3</option><option>G4</option><option>GX</option></select><select id="sf" onchange="stockRender()"><option value="">全部规格</option><option>85</option><option>185</option><option>200</option><option>300</option><option>400</option></select></div><div id="stock"></div></div></section></main><nav class="tabs"><button class="on" data-go="todayPage"><span>🥫</span>今天</button><button data-go="planPage"><span>📅</span>7天计划</button><button data-go="stockPage"><span>🔎</span>库存</button></nav><script>const KEY='gulu-real-stock-v1';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{batches:[],catalog:{},open:[]};S.batches=S.batches||[];S.catalog=S.catalog||{};S.open=S.open||[];const R={'eu-catz-finefood-n-403-huhn-in-jelly-pouch':['凯姿 · 403鸡肉','G1','B',1597,.72,'images/catz-403.png'],'eu-catz-finefood-n-409-pute-huhn-kaninchen-in-jelly-pouch':['凯姿 · 409火鸡鸡肉兔肉','G1','B',1531,.72,'images/catz-409.png'],'eu-catz-finefood-n-413-huhn-thunfisch-in-jelly-pouch':['凯姿 · 413鸡肉吞拿鱼','G1','B',1520,.69,'images/catz-413.png'],'eu-granatapet-no-8-fasan-ente-mit-huhn-tin':['交响乐 · No.8雉鸡鸭肉鸡肉','G1','B',1537,.73,'images/granata-08.png'],'eu-purizon-purizon-original-adult-huehnerfilet-mit-wildschwein-tin':['德金 · 鸡肉野猪','G2','B',1860,.87,'images/purizon-wildboar.png'],'eu-granatapet-no-9-fasan-kaninchen-tin':['交响乐 · No.9雉鸡兔肉','G4','A',2653,1.18,'images/placeholder.png']};for(const[id,v]of Object.entries(R))Object.assign(S.catalog[id]||(S.catalog[id]={}),{name:v[0],renalGrade:v[1],confidence:v[2],phosphorusMg1000kcal:v[3],phosphorusDM:v[4],image:v[5]});date.textContent=new Date().toLocaleDateString('zh-CN',{dateStyle:'full'});const C=id=>{let x=S.catalog[id]||{};return{name:x.name||x.flavor||id,g:x.renalGrade||'GX',c:x.confidence||'D',mg:x.phosphorusMg1000kcal,dm:x.phosphorusDM,img:localStorage.getItem('gulu-img-'+id)||x.image||'images/placeholder.png'}};function groups(){let o={};for(const b of S.batches){if(+b.count<=0)continue;let k=b.canId+'|'+b.grams;o[k]||(o[k]={id:b.canId,grams:+b.grams,count:0});o[k].count+=+b.count}return Object.values(o)}const O={G1:0,G2:1,GX:2,G3:3,G4:4};const sort=(a,b)=>O[C(a.id).g]-O[C(b.id).g]||(C(a.id).mg??99999)-(C(b.id).mg??99999)||b.count-a.count;const info=id=>{let x=C(id);return`${x.g} · 可信度${x.c}${Number.isFinite(x.mg)?' · '+Math.round(x.mg)+'mg/1000kcal':' · 磷未知'}${Number.isFinite(x.dm)?' · DM '+x.dm+'%':''}`};function node(x,upload=false){let c=C(x.id),d=document.createElement('div');d.className='row';d.innerHTML=`<img class="pic" src="${c.img}" onerror="this.src='images/placeholder.png'"><div><div class="title">${c.name}</div><div class="meta">${x.grams||''}g · ${info(x.id)}</div>${upload?`<label class="upload">更换图片<input hidden type="file" accept="image/*"></label>`:''}</div>${x.count==null?'':`<div class="qty">${x.count}</div>`}`;if(upload){let i=d.querySelector('input');i.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{localStorage.setItem('gulu-img-'+x.id,r.result);render()};r.readAsDataURL(f)}}return d}function render(){let g=groups().sort(sort);today.replaceChildren();today.append(g.length?node(g[0]):Object.assign(document.createElement('p'),{textContent:'未读取到本地库存'}));plan.replaceChildren();for(let i=0;i<7;i++){let x=g[i%Math.max(1,g.length)];let d=document.createElement('div');d.className='row';if(x){d.append(node(x).querySelector('.pic'));let t=document.createElement('div');t.innerHTML=`<div class="title">${new Date(Date.now()+i*864e5).toLocaleDateString('sv-SE')} · ${i%3===0?'开1个':'不开新罐'}</div>${i%3===0?`<div class="meta">${C(x.id).name} · ${x.grams}g · ${info(x.id)}</div>`:''}`;d.append(t)}plan.append(d)}stockRender()}function stockRender(){let z=groups().filter(x=>(C(x.id).name+' '+x.grams).toLowerCase().includes(q.value.toLowerCase())&&(!gf.value||C(x.id).g===gf.value)&&(!sf.value||String(x.grams)===sf.value)).sort(sort);stock.replaceChildren(...z.map(x=>node(x,true)))}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.go).classList.add('on')});render();</script>
