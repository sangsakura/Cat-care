<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>咕噜开罐计划</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5fc;color:#262334;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding-bottom:82px}.hero{padding:52px 20px 30px;background:linear-gradient(135deg,#765cda,#ad91e9);color:white;border-radius:0 0 30px 30px}.hero h1{margin:0;font-size:32px}.hero p{font-size:17px}.main{max-width:720px;margin:auto;padding:16px}.page{display:none}.page.active{display:block}.panel,.stat{background:#fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #50437710}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{margin:0}.stat b{font-size:38px;display:block}.muted{color:#777184;font-size:14px;line-height:1.5}.card{background:#f8f6ff;border-radius:16px;padding:14px;margin:10px 0;min-width:0}.row{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center}.pic{width:84px;height:84px;object-fit:contain;background:#fff;border:1px solid #eee;border-radius:12px}.title{font-weight:800;font-size:17px;line-height:1.45;overflow-wrap:anywhere}.qty{font-size:22px;font-weight:900}.plan{border-left:6px solid #d6cef8}.plan.open{border-left-color:#efa02d}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.badge{background:#eae5fb;color:#6652ca;padding:6px 10px;border-radius:999px;font-size:12px}.btn{border:0;border-radius:12px;background:#7259da;color:#fff;padding:12px 14px;font-weight:800}.btn.alt{background:#eee9ff;color:#624cc5}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;padding:13px;border:1px solid #ded8eb;border-radius:12px;font-size:16px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e6e1ef;display:grid;grid-template-columns:repeat(4,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}.tabs button{border:0;background:white;padding:9px 2px;color:#77717f}.tabs button.active{color:#654fcb;font-weight:800}.tabs span{display:block;font-size:22px}.notice{background:#fff1d3;border-left:5px solid #eda12d;padding:13px;border-radius:10px;line-height:1.55;font-size:13px}</style></head><body><header class="hero"><h1>🐱 咕噜开罐计划</h1><p id="date"></p></header><main class="main"><section id="today" class="page active"><div class="stats"><div class="stat"><b id="count">0</b><span class="muted">真实未开封库存</span></div><div class="stat"><b id="opened">0/2</b><span class="muted">当前已开/上限</span></div></div><div class="panel"><h2>今天</h2><div id="todayCard"></div></div><div class="notice">优先清已开罐；新开罐按肾脏等级、mg/1000kcal、近期回避、库存和规格排序。GranataPet更新配方以官网数据为主。</div></section><section id="plan" class="page"><div class="panel"><div class="head"><h2>未来7天计划</h2><button class="btn alt" onclick="buildPlan();renderPlan()">重算</button></div><div id="planList"></div></div></section><section id="stock" class="page"><div class="panel"><h2>图片库存</h2><input id="q" placeholder="搜索商品" oninput="renderStock()"><div class="filters"><select id="gf" onchange="renderStock()"><option value="">全部等级</option><option>G1</option><option>G2</option><option>G3</option><option>G4</option><option>GX</option></select><select id="sf" onchange="renderStock()"><option value="">全部规格</option><option>85</option><option>125</option><option>185</option><option>200</option><option>300</option><option>400</option></select></div><div id="stockList"></div></div></section><section id="settings" class="page"><div class="panel"><h2>数据</h2><p class="muted">页面会自动读取之前保存在Safari中的咕噜库存。若库存显示0，可导入原APP导出的JSON。</p><input type="file" id="imp" accept="application/json"><button class="btn" style="margin-top:10px" onclick="importJson()">导入JSON</button></div></section></main><nav class="tabs"><button class="active" data-p="today"><span>🥫</span>今天</button><button data-p="plan"><span>📅</span>7天计划</button><button data-p="stock"><span>🔎</span>库存</button><button data-p="settings"><span>⚙️</span>设置</button></nav><script>
const GR={G1:0,G2:1,GX:2,G3:3,G4:4};const renal={
'eu-baltica-mono-bazant-dla-kota-18':['G1','B',1361,.63],'eu-granatapet-pferd-huhn-pouch':['G1','B',1408,.64],'eu-catz-finefood-n-413-huhn-thunfisch-in-jelly-pouch':['G1','B',1520,.69],'eu-catz-finefood-n-409-pute-huhn-kaninchen-in-jelly-pouch':['G1','B',1531,.72],'eu-granatapet-no-8-fasan-ente-mit-huhn-tin':['G1','B',1537,.73],'eu-granatapet-ente-huhn-pouch':['G1','B',1540,.73],'eu-catz-finefood-n-403-huhn-in-jelly-pouch':['G1','B',1597,.72],'eu-purizon-purizon-original-adult-huehnerfilet-mit-lachs-tin':['G2','B',1718,.8],'eu-granatapet-huhn-pur-pouch-85g':['G2','B',1732,.82],'eu-catz-finefood-n-5-lachs-gefluegel-tin':['G2','B',1744,.82],'eu-granatapet-huhn-kaninchen-pouch':['G2','B',1748,.82],'eu-venandi-animal-pute-als-monoprotein-tin':['G2','B',1834,.9],'eu-purizon-purizon-original-adult-huehnerfilet-mit-wildschwein-tin':['G2','B',1860,.87],'eu-catz-finefood-n-3-gefluegel-800-g-tin-tin':['G2','B',1915,.9],'eu-catz-finefood-n-15-huhn-fasan-800-g-tin-tin':['G2','B',1931,.9],'eu-catz-finefood-n-17-gefluegel-garnelen-800-g-tin-tin':['G2','B',1931,.9],'eu-catz-finefood-n-25-huhn-thunfisch-800-g-tin-tin':['G2','B',1931,.9],'eu-venandi-animal-huhn-kaninchen-tin':['G3','B',2262,1.14],'eu-granatapet-no-3-wild-huhn-tin':['G4','B',2485,1.19],'eu-granatapet-no-5-huhn-pur-tin':['G4','B',2487,1.2],'eu-granatapet-no-9-fasan-kaninchen-tin':['G4','A',2653,1.18],'eu-mjamjam-senior-saftiges-huehnchen-tin':['G4','B',2677,1.25]};
let S=JSON.parse(localStorage.getItem('gulu-real-stock-v1')||'null')||{batches:[],catalog:{},open:[],usage:[],avoidUntil:{}};S.batches=S.batches||[];S.catalog=S.catalog||{};S.open=S.open||[];S.avoidUntil=S.avoidUntil||{};let plan=[];const el=(t,c,x)=>{let n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n},iso=()=>new Date().toLocaleDateString('sv-SE'),add=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')};date.textContent=new Date().toLocaleDateString('zh-CN',{dateStyle:'full'});
function info(id){let c=S.catalog[id]||{},r=renal[id]||['GX','D',null,null];return{name:c.name||((c.brand||'其他品牌')+' · '+(c.flavor||id)),brand:c.brand||'',grade:r[0],conf:r[1],mg:r[2],dm:r[3]}}function image(id){let x=info(id),s=(x.brand+' '+x.name).toLowerCase(),f=s.includes('凯姿')?'catz':s.includes('交响乐')?'granatapet':s.includes('喵吖喵')?'mjamjam':s.includes('老奶奶')?'bettys':s.includes('蔚安迪')?'venandi':s.includes('德金')?'purizon':s.includes('波罗的海')?'baltica':s.includes('斐列西塔')?'fellicita':s.includes('歌吉诗')?'goddess':'default';return'images/'+f+'.jpg'}function meta(id){let x=info(id);return`${x.grade} · 可信度${x.conf}${x.mg?' · '+x.mg+'mg/1000kcal':' · 磷未知'}${x.dm?' · DM '+x.dm+'%':''}`}function groups(){let o={};for(let b of S.batches){if(+b.count<=0)continue;let id=b.canId||b.id,k=id+'|'+b.grams;if(!o[k])o[k]={id,g:+b.grams,count:0};o[k].count+=+b.count}return Object.values(o)}function sort(a,b){let A=info(a.id),B=info(b.id);return GR[A.grade]-GR[B.grade]||(A.mg||99999)-(B.mg||99999)||b.count-a.count||a.g-b.g}function card(x,extra=''){let d=el('div','card '+extra),r=el('div','row'),im=el('img','pic');im.src=image(x.id);im.onerror=()=>im.src='images/default.jpg';let tx=el('div');tx.append(el('div','title',info(x.id).name),el('div','muted',`${x.g}g · ${meta(x.id)}`));r.append(im,tx,el('div','qty',x.count!=null?String(x.count):''));d.append(r);return d}function buildPlan(){let st=groups().sort(sort),stock=st.map(x=>({...x})),left=0,current=null;plan=[];for(let i=0;i<7;i++){let open=null;if(left<80){current=stock.find(x=>x.count>0);if(current){current.count--;left+=current.g;open={id:current.id,g:current.g}}}left=Math.max(0,left-80);plan.push({day:add(iso(),i),open})}}function renderPlan(){planList.replaceChildren();for(let p of plan){let d=el('div','card plan '+(p.open?'open':'')),h=el('div','head');h.append(el('b','',p.day),el('span','badge',p.open?'开1个':'不开新罐'));d.append(h);if(p.open)d.append(card({...p.open,count:null}));planList.append(d)}}function renderStock(){let a=groups().filter(x=>(info(x.id).name+' '+x.g).toLowerCase().includes(q.value.toLowerCase())&&(!gf.value||info(x.id).grade===gf.value)&&(!sf.value||String(x.g)===sf.value)).sort(sort);stockList.replaceChildren(...a.map(x=>card(x)))}function render(){count.textContent=S.batches.reduce((n,b)=>n+Math.max(0,+b.count||0),0);opened.textContent=(S.open.filter(x=>(x.left??x.remainingGrams??0)>0).length)+'/2';if(!plan.length)buildPlan();todayCard.replaceChildren(plan[0]?.open?card({...plan[0].open,count:null}):el('p','muted','暂无建议'));renderPlan();renderStock()}function importJson(){let f=imp.files[0];if(!f)return alert('请选择JSON');let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);localStorage.setItem('gulu-real-stock-v1',JSON.stringify(d));location.reload()}catch(e){alert('JSON格式不正确')}};r.readAsText(f)}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.p).classList.add('active')});render();
</script></body></html>
