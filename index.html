<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>咕噜开罐计划 FINAL 2.0</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#263b80;color:white;padding:18px}main{max-width:980px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}input,select,button{font:inherit;padding:10px;border:1px solid #ccd3e0;border-radius:9px}button{background:#3157c8;color:white;border:0;font-weight:600}.muted{color:#667085}.warn{color:#a33}.metric{font-size:24px;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}</style></head><body><header><h1>🐱 咕噜开罐计划</h1><div>FINAL 2.0 · 实际摄入后自动重算7天/30天磷负荷</div></header><main><section class="card"><h2>1. 导入原始备份</h2><input id="file" type="file" accept=".json,.txt"><p class="muted">支持原APP导出的JSON、TXT或无扩展名文件。数据保存在当前浏览器。</p><button id="export">导出完整备份</button></section><section class="card"><h2>周期指标</h2><div class="grid"><div><div class="muted">滚动7天</div><div class="metric" id="m7">暂无数据</div><div id="c7"></div></div><div><div class="muted">滚动30天</div><div class="metric" id="m30">暂无数据</div><div id="c30"></div></div><div><div class="muted">当前已开</div><div class="metric" id="openN">0 / 2</div></div></div><p class="warn" id="warning"></p></section><section class="card"><h2>2. 补录实际摄入</h2><div class="grid"><input id="date" type="date"><input id="sku" placeholder="SKU/罐头名称"><input id="grams" type="number" min="0.1" step="0.1" placeholder="实际摄入克数"><input id="kcal" type="number" min="0.1" step="0.1" placeholder="kcal/100g"><input id="p" type="number" min="1" step="1" placeholder="磷 mg/1000kcal"><select id="grade"><option>G1</option><option>G2</option><option>G3</option><option>G4</option><option selected>GX</option></select></div><br><button id="save">保存并重算</button></section><section class="card"><h2>实际摄入记录</h2><div style="overflow:auto"><table><thead><tr><th>日期</th><th>SKU</th><th>克数</th><th>磷</th><th></th></tr></thead><tbody id="logs"></tbody></table></div></section><section class="card"><h2>规则</h2><ul><li>周期负荷=已知总磷mg÷已知总热量kcal×1000，不做简单平均。</li><li>GX不按0磷计算，覆盖率低于80%时提示估算不完整。</li><li>历史记录保存营养快照，后续配方更新不会倒改历史。</li><li>最多同时开2罐；实际少吃不追喂，多吃不惩罚性扣减。</li></ul></section></main><script>const K='gulu-final-2';let S=JSON.parse(localStorage.getItem(K)||'{"logs":[],"openCans":[],"raw":null}');const $=x=>document.getElementById(x);$('date').value=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'});function save(){localStorage.setItem(K,JSON.stringify(S));render()}function calc(days){let end=new Date($('date').value+'T23:59:59+08:00'),start=new Date(end);start.setDate(start.getDate()-days+1);let t=0,k=0,pm=0,u=0;S.logs.forEach(x=>{let d=new Date(x.date+'T12:00:00+08:00');if(d<start||d>end)return;let cal=x.grams*x.kcalPer100g/100;if(Number.isFinite(cal)){t+=cal;if(x.phosphorusMg1000kcal){k+=cal;pm+=cal*x.phosphorusMg1000kcal/1000}else u+=cal}});return{load:k?pm/k*1000:null,cov:t?k/t:0,unknown:t?u/t:0}}function render(){for(const [d,id,cid] of [[7,'m7','c7'],[30,'m30','c30']]){let m=calc(d);$(id).textContent=m.load?Math.round(m.load)+' mg/1000kcal':'暂无可靠数据';$(cid).textContent='数据覆盖率 '+Math.round(m.cov*100)+'%'}$('openN').textContent=S.openCans.filter(x=>x.remainingGrams>.5).length+' / 2';let a=[calc(7),calc(30)];$('warning').textContent=a.some(x=>x.cov<.8&&x.cov>0)?'营养数据覆盖率低于80%，周期磷负荷仅供参考；GX未按0磷处理。':'';$('logs').innerHTML=S.logs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${x.date}</td><td>${x.skuId}</td><td>${x.grams}g</td><td>${x.phosphorusMg1000kcal||'GX'}</td><td><button onclick="del('${x.id}')">删除</button></td></tr>`).join('')}window.del=id=>{S.logs=S.logs.filter(x=>x.id!==id);save()};$('save').onclick=()=>{let g=+$('grams').value,k=+$('kcal').value,p=+$('p').value;if(!g||!k||!$('sku').value.trim())return alert('请填写日期、SKU、克数和kcal/100g');S.logs.push({id:crypto.randomUUID(),date:$('date').value,skuId:$('sku').value.trim(),grams:g,kcalPer100g:k,phosphorusMg1000kcal:p||null,renalGrade:$('grade').value,createdAt:new Date().toISOString()});save()};$('file').onchange=async e=>{let text=await e.target.files[0].text();try{let raw=JSON.parse(text);S.raw=raw;let meals=raw.meals||[];for(const m of meals){if(!m.grams||!m.canId)continue;let date=new Date(m.at).toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'});if(!S.logs.some(x=>x.sourceId===m.id))S.logs.push({id:crypto.randomUUID(),sourceId:m.id,date,skuId:m.canId,grams:+m.grams,kcalPer100g:null,phosphorusMg1000kcal:null,renalGrade:'GX'})}save();alert('导入成功。缺少能量/磷数据的历史记录已标记GX，不会按0磷计算。')}catch(err){alert('无法解析文件：'+err.message)}};$('export').onclick=()=>{let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gulu_final_2_backup.json';a.click();URL.revokeObjectURL(a.href)};render();</script></body></html>
