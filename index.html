<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>咕噜开罐计划</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5fc;color:#292638;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:72px}.hero{background:linear-gradient(135deg,#725ed6,#aa8ce8);color:#fff;padding:24px 18px;border-radius:0 0 26px 26px}.hero h1{margin:0}.wrap{padding:14px;max-width:700px;margin:auto}.card,.kpi{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 3px 15px #33256610}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi b{display:block;font-size:28px}.muted{color:#7c7689;font-size:13px}button,.file{border:0;border-radius:12px;padding:12px;background:#725ed6;color:#fff;font-weight:700;display:inline-block}.sec{background:#eeeafd;color:#6552c7}.big{width:100%;font-size:16px;padding:15px}.day,.open,.log{padding:12px;margin:9px 0;border-radius:14px;background:#f8f6ff}.day{border-left:5px solid #d2c8f5}.new{border-left-color:#e49a34}.blocked{border-left-color:#c84d61;background:#fff3f5}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#ebe7fa;color:#6654c8}.warn{background:#fff0d7;color:#9d5800}.bad{background:#ffe3e8;color:#a92e43}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #e9e5f2}.tabs button{flex:1;background:#fff;color:#777181;border-radius:0;font-size:11px}.tabs button.on{color:#6552c7}.page{display:none}.page.on{display:block}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:9;align-items:flex-end}.modal.on{display:flex}.sheet{background:#fff;width:100%;padding:18px;border-radius:22px 22px 0 0}label{display:block;font-size:12px;color:#777181;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #ddd7eb;border-radius:11px;font-size:15px}.notice{font-size:12px;background:#fff5df;border-left:4px solid #e49a34;padding:10px;border-radius:8px}.empty{text-align:center;padding:30px 10px}@media(min-width:700px){.tabs{max-width:700px;left:50%;transform:translateX(-50%)}}</style></head><body><header class="hero"><h1>🐱 咕噜开罐计划</h1><div style="font-size:11px;opacity:.85">Final Compatible 2026-10-21</div><p id="date"></p></header><main class="wrap"><section id="p0" class="page on"><div id="setup" class="card empty"><h2>首次使用</h2><p class="muted">导入现有APP导出的完整JSON。数据只保存在当前手机浏览器。</p><label class="file">选择备份文件（TXT、JSON或无扩展名）<input hidden type="file" onchange="loadSource(event)"></label></div><div id="app" hidden><div class="grid"><div class="kpi"><b id="stock">0</b><span class="muted">未开封</span></div><div class="kpi"><b id="opened">0/2</b><span class="muted">当前已开/上限</span></div></div><div class="card" style="margin-top:12px"><h2>今天</h2><div id="today"></div><button class="big" onclick="eatUI()">记录实际摄入量</button></div><div class="card"><h2>当前已开</h2><div id="opens"></div><button id="openBtn" class="sec" onclick="openUI()">手工开罐</button></div><div class="notice">硬规则：最多同时开2个。系统先清临期和剩余较少的开罐；只有现有余量不足以覆盖预计用量时，才计划开下一罐。</div></div></section><section id="p1" class="page"><div class="card"><div class="row between"><h2>未来7天</h2><button class="sec" onclick="calc();render()">重新计算</button></div><div id="week"></div></div></section><section id="p2" class="page"><div class="card"><h2>实际摄入记录</h2><button class="sec" onclick="backup()">导出备份</button><div id="logs"></div></div></section><section id="p3" class="page"><div class="card"><h2>设置</h2><label>每日预计湿粮克数，仅用于预测</label><input id="target" type="number" value="80"><button style="margin-top:12px" onclick="setTarget()">保存并重算</button><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><label class="file sec">重新导入备份文件<input hidden type="file" onchange="loadSource(event)"></label></div></section></main><nav class="tabs"><button class="on" data-i="0">🥫<br>今天</button><button data-i="1">📅<br>7天计划</button><button data-i="2">✍️<br>实际摄入</button><button data-i="3">⚙️<br>设置</button></nav><div id="om" class="modal"><div class="sheet"><div class="row between"><h2>手工开罐</h2><button class="sec" onclick="cm('om')">关闭</button></div><label>品项</label><select id="oi"></select><label>开封时实际克数</label><input id="og" type="number"><label>类型</label><select id="ot"><option value="regular">普通罐，14天内</option><option value="small">85g，当天吃完</option><option value="stew">炖罐，1～1.5天</option></select><button class="big" style="margin-top:12px" onclick="openSave()">确认开罐</button></div></div><div id="em" class="modal"><div class="sheet"><div class="row between"><h2>记录实际摄入</h2><button class="sec" onclick="cm('em')">关闭</button></div><label>从哪个开罐中吃</label><select id="ei"></select><label>实际吃掉克数</label><input id="eg" type="number"><label>备注</label><input id="en" placeholder="如：食欲一般、剩了一些"><button class="big" style="margin-top:12px" onclick="eatSave()">保存并顺延计划</button></div></div><script>
const K='gulu-openplan-max2-v1';let B,S;const D=()=>new Date().toLocaleDateString('sv-SE'),A=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')},U=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);date.textContent=new Date().toLocaleDateString('zh-CN',{dateStyle:'full'});
function zh(id){const m={huhn:'鸡肉',huehnchen:'鸡肉',pute:'火鸡',truthahn:'火鸡',kaninchen:'兔肉',ente:'鸭肉',rind:'牛肉',pferd:'马肉',lachs:'三文鱼',thunfisch:'吞拿鱼',garnelen:'对虾',kaenguru:'袋鼠',wildschwein:'野猪',fasan:'雉鸡',gefluegel:'家禽',moehrchen:'胡萝卜',kuerbis:'南瓜',spinat:'菠菜'};let br=id.includes('catz-finefood')?'凯姿':id.includes('granatapet')?'交响乐':id.includes('mjamjam')?'喵吖喵':id.includes('betty-s')?'老奶奶':id.includes('wildes-land')?'王尔德':id.includes('purizon')?'德金':id.includes('leonardo')?'小李子':'其他品牌';let a=[];for(let k in m)if(id.includes(k)&&!a.includes(m[k]))a.push(m[k]);return br+' · '+(a.join('/')||'自定义口味')}
function nm(id){return B.names?.[id]||zh(id)}function sv(){localStorage.setItem(K,JSON.stringify({B,S}))}function groups(){let o={};S.batches.filter(x=>x.count>0).forEach(x=>{let k=x.canId+'|'+x.grams;if(!o[k])o[k]={id:x.canId,g:x.grams||85,c:0};o[k].c+=+x.count});return Object.values(o)}function deduct(id){let x=S.batches.filter(x=>x.canId===id&&x.count>0).sort((a,b)=>(a.bestBefore||'9999').localeCompare(b.bestBefore||'9999'))[0];if(!x)return 0;x.count--;return 1}
function normalizeBackup(x){if(x&&x.B&&x.S)return{xB:x.B,xS:x.S};let cid=x.activeCatId||x.currentCatId||x.catId;let p=Array.isArray(x.batches)?x.batches:Array.isArray(x.pantry)?x.pantry:(x.pantry&&Array.isArray(x.pantry[cid])?x.pantry[cid]:x.pantry?Object.values(x.pantry).find(Array.isArray):null);if(!p)throw new Error('未识别到batches或pantry库存结构');let names={};let src=x.catalogZh||x.catalog||x.products||{};for(const [k,v] of Object.entries(src)){if(v&&typeof v==='object')names[k]=v.displayName||v.name||v.zhName||v.flavor||k;else names[k]=String(v)}let batches=p.map(z=>({id:z.id||z.uid||Math.random().toString(36).slice(2),canId:z.canId||z.productId||z.itemId||z.id,grams:+(z.grams||z.size||z.netWeight||0),count:+(z.count??z.quantity??z.qty??0),bestBefore:z.bestBefore||z.expiry||z.expireDate||''})).filter(z=>z.canId&&z.grams>0);return{xB:{names},xS:{target:80,batches,open:x.open||x.opened||x.openCans||[],use:x.use||x.usage||x.logs||[],plan:[]}}}function loadSource(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let raw=String(r.result||'').replace(/^\uFEFF/,'').trim(),x=JSON.parse(raw),n=normalizeBackup(x);B=n.xB;S=n.xS;start();alert('导入成功：'+S.batches.length+'个批次，共'+S.batches.reduce((a,b)=>a+(+b.count||0),0)+'件库存')}catch(err){alert('导入失败：'+err.message)}};r.onerror=()=>alert('无法读取该文件');r.readAsText(f,'utf-8')}function start(){setup.hidden=true;app.hidden=false;target.value=S.target;render()}
function expiryDays(t){return t==='small'?0:t==='stew'?1:13}function sortOpen(a){return a.sort((x,y)=>x.due.localeCompare(y.due)||x.left-y.left)}
function calc(){let virtualOpen=S.open.filter(x=>x.left>0).map(x=>({...x})),stock=groups().sort((a,b)=>(a.g===85?0:a.g<=200?1:2)-(b.g===85?0:b.g<=200?1:2)),plan=[];for(let i=0;i<7;i++){let day=A(D(),i),need=S.target,acts=[],blocked=false;while(need>0){sortOpen(virtualOpen);let o=virtualOpen[0];if(!o){let x=stock.find(x=>x.c>0);if(!x)break;x.c--;let t=x.g===85?'small':'regular';o={sim:U(),canId:x.id,left:x.g,type:t,due:A(day,expiryDays(t))};virtualOpen.push(o);acts.push({k:'open',id:x.id,g:x.g,type:t})}let take=Math.min(need,o.left);o.left-=take;need-=take;acts.push({k:'eat',id:o.canId,g:take});virtualOpen=virtualOpen.filter(x=>x.left>0);if(need>0&&virtualOpen.length>=2){blocked=true;break}if(need>0&&!virtualOpen.length)continue;if(need>0&&virtualOpen.length<2){let current=virtualOpen.reduce((a,x)=>a+x.left,0);if(current>=need)continue;let x=stock.find(x=>x.c>0);if(x){x.c--;let t=x.g===85?'small':'regular';virtualOpen.push({sim:U(),canId:x.id,left:x.g,type:t,due:A(day,expiryDays(t))});acts.push({k:'open',id:x.id,g:x.g,type:t})}}}plan.push({date:day,acts,blocked})}S.plan=plan;sv()}
function render(){stock.textContent=S.batches.reduce((a,x)=>a+Math.max(0,+x.count),0);let op=sortOpen(S.open.filter(x=>x.left>0));opened.textContent=op.length+'/2';openBtn.disabled=op.length>=2;openBtn.textContent=op.length>=2?'已达2个上限':'手工开罐';let first=op[0],oa=S.plan[0]?.acts.find(x=>x.k==='open');today.innerHTML=first?`<div class="open"><b>优先继续：${nm(first.canId)}</b><div>剩余 ${first.left}g · ${first.due}前吃完</div></div>`:oa?`<div class="open"><b>建议开：${nm(oa.id)}</b><div>${oa.g}g</div></div>`:'暂无计划';opens.innerHTML=op.length?op.map(x=>`<div class="open"><b>${nm(x.canId)}</b><div>剩余 ${x.left}g · ${x.due}前</div></div>`).join(''):'<p class="muted">没有已开包装</p>';week.innerHTML=S.plan.map(p=>{let os=p.acts.filter(x=>x.k==='open'),es={};p.acts.filter(x=>x.k==='eat').forEach(x=>es[x.id]=(es[x.id]||0)+x.g);return `<div class="day ${os.length?'new':''} ${p.blocked?'blocked':''}"><div class="row between"><b>${p.date}</b><span class="pill">${os.length?'开'+os.length+'个':'不开新罐'}</span></div>${os.map(x=>`<div><b>开：${nm(x.id)}</b> ${x.g}g</div>`).join('')}${Object.entries(es).map(([id,g])=>`<div class="muted">预计吃${g}g · ${nm(id)}</div>`).join('')}${p.blocked?'<div class="pill bad">已达2个开罐上限，不再开新罐</div>':''}</div>`}).join('');logs.innerHTML=S.use.length?S.use.map(x=>`<div class="log"><div class="row between"><b>${x.date}</b><b>${x.g}g</b></div><div>${nm(x.id)}</div><div class="muted">${x.note||''}</div></div>`).join(''):'暂无记录';sv()}
function openUI(){if(S.open.filter(x=>x.left>0).length>=2)return alert('当前已经有2个未吃完的开罐，请先吃完至少1个');let a=groups();oi.innerHTML=a.map(x=>`<option value="${x.id}">${nm(x.id)}｜${x.g}g｜余${x.c}</option>`).join('');og.value=a[0]?.g||'';ot.value=a[0]?.g===85?'small':'regular';om.classList.add('on')}oi.onchange=()=>{let x=groups().find(y=>y.id===oi.value);og.value=x.g;ot.value=x.g===85?'small':'regular'};function openSave(){if(S.open.filter(x=>x.left>0).length>=2)return alert('已达2个开罐上限');if(!deduct(oi.value))return alert('库存不足');let g=+og.value,t=ot.value;S.open.push({id:U(),canId:oi.value,left:g,type:t,due:A(D(),expiryDays(t))});calc();render();cm('om')}function eatUI(){let a=sortOpen(S.open.filter(x=>x.left>0));if(!a.length)return alert('请先开罐');ei.innerHTML=a.map(x=>`<option value="${x.id}">${nm(x.canId)}｜剩${x.left}g</option>`).join('');eg.value=Math.min(S.target,a[0].left);em.classList.add('on')}function eatSave(){let x=S.open.find(x=>x.id===ei.value),g=+eg.value;if(g<0)return;if(g>x.left)return alert('超过该开罐剩余量');x.left-=g;S.use.unshift({date:D(),id:x.canId,g,note:en.value});calc();render();cm('em')}function setTarget(){S.target=Math.max(20,+target.value||80);calc();render();alert('已根据实际余量重新顺延未来7天')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({B,S},null,2)],{type:'application/json'}));a.download='咕噜开罐计划备份_'+D()+'.json';a.click()}function cm(id){document.getElementById(id).classList.remove('on')}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('p'+b.dataset.i).classList.add('on')});let old=JSON.parse(localStorage.getItem(K)||'null');if(old){B=old.B;S=old.S;start()}
</script></body></html>
