:1,GX:2,G3:3,G4:4};const D=()=>new Date().toLocaleDateString('sv-SE'),A=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')};date.textContent=new Date().toLocaleDateString('zh-CN',{dateStyle:'full'});function clone(x){return JSON.parse(JSON.stringify(x))}function initial(){return{batches:clone(EMBEDDED.batches),catalog:clone(EMBEDDED.catalog),images:EMBEDDED.images,open:[],logs:[],avoid:{},target:80,plan:[]}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&x.batches?x:initial()}catch(e){return initial()}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function c(id){return S.catalog[id]||{name:id,brand:'其他品牌',grade:'GX',confidence:'D',imageKey:''}}function groups(){let o={};for(const b of S.batches){if(+b.count<1)continue;let k=b.canId+'|'+b.grams;if(!o[k])o[k]={id:b.canId,g:+b.grams,count:0,best:b.bestBefore||'9999'};o[k].count+=+b.count;if((b.bestBefore||'9999')<o[k].best)o[k].best=b.bestBefore}return Object.values(o)}function openNow(){return S.open.filter(x=>x.left>0).sort((a,b)=>a.due.localeCompare(b.due))}function cmp(a,b){let A=c(a.id),B=c(b.id),aa=S.avoid[a.id]>=D()?1:0,bb=S.avoid[b.id]>=D()?1:0;return aa-bb||(G[A.grade]-G[B.grade])||((A.mg??99999)-(B.mg??99999))||a.best.localeCompare(b.best)||b.count-a.count||a.g-b.g}function renal(id){let x=c(id);return `${x.grade} · 可信度${x.confidence}${x.mg?' · '+x.mg+'mg/1000kcal':' · 磷未知'}${x.dm?' · DM '+x.dm+'%':''}`}function image(id){let k=c(id).imageKey;return S.customImages?.[id]||S.images[k]||''}function e(t,cl,tx){let x=document.createElement(t);if(cl)x.className=cl;if(tx!=null)x.textContent=tx;return x}function product(x,showQty=true){let d=e('div','card product'),im=e('img','photo');im.src=image(x.id)||'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100"><rect width="100%" height="100%" fill="%23eee9fb"/><text x="50%" y="58%" text-anchor="middle" font-size="40">🥫</text></svg>';let m=e('div');m.append(e('div','title',c(x.id).name),e('div','meta',`${x.g}g · ${renal(x.id)}`));d.append(im,m,showQty?e('div','qty',String(x.count)):e('span'));return d}function plan(){let os=openNow().map(x=>({...x})),st=groups().sort(cmp).map(x=>({...x})),p=[];for(let i=0;i<7;i++){let need=S.target,acts=[];while(need>0){os=os.filter(x=>x.left>0).sort((a,b)=>a.due.localeCompare(b.due));let x=os[0];if(!x){let n=st.find(v=>v.count>0);if(!n)break;n.count--;x={id:n.id,left:n.g,due:A(D(),n.g===85?0:13)};os.push(x);acts.push({id:n.id,g:n.g})}let z=Math.min(need,x.left);x.left-=z;need-=z}p.push({day:A(D(),i),acts})}S.plan=p;save()}function render(){total.textContent=groups().reduce((a,x)=>a+x.count,0);openCount.textContent=openNow().length+'/2';today.replaceChildren();let os=openNow(),x=os[0],a=S.plan[0]?.acts[0];if(x)today.append(product({id:x.id,g:x.left,count:0},false));else if(a)today.append(product({...a,count:0},false));else today.append(e('div','empty','暂无建议'));openList.replaceChildren();if(!os.length)openList.append(e('div','empty','暂无已开罐'));for(const o of os)openList.append(product({id:o.id,g:o.left,count:0},false));renderWeek();renderStock();renderLogs();save()}function renderWeek(){week.replaceChildren();for(const p of S.plan){let d=e('div','card plan'+(p.acts.length?' new':'')),h=e('div','head');h.append(e('b','',p.day),e('span','pill',p.acts.length?'开'+p.acts.length+'个':'不开新罐'));d.append(h);for(const a of p.acts){d.append(product({...a,count:0},false));let b=e('button','sec','换一个');b.onclick=()=>{S.avoid[a.id]=A(D(),6);plan();render()};d.append(b)}week.append(d)}}function renderStock(){let q=search.value.toLowerCase(),gr=grade.value,sz=size.value;stock.replaceChildren();let arr=groups().filter(x=>(c(x.id).name+' '+x.g).toLowerCase().includes(q)&&(!gr||c(x.id).grade===gr)&&(!sz||String(x.g)===sz)).sort(cmp);for(const x of arr){let d=product(x),lab=e('label','filebtn sec','更换图片'),inp=e('input');inp.type='file';inp.accept='image/*';inp.hidden=true;lab.append(inp);inp.onc ton class="wide" id="as">保存</button>';as.onclick=()=>{if(!an.value||+ag.value<=0||+ac.value<=0)return alert('请填写完整');let id='usr-'+Date.now();S.catalog[id]={name:(ab.value||'自定义品牌')+' · '+an.value,brand:ab.value||'自定义品牌',grade:'GX',confidence:'D',imageKey:''};S.batches.push({id:Date.now().toString(),canId:id,grams:+ag.value,count:+ac.value});plan();render();closeM()};modal.classList.add('on')}function normalise(x){if(x.activeCatId&&x.pantry){let p=x.pantry[x.activeCatId]||Object.values(x.pantry).find(Array.isArray);return{batches:p,catalog:S.catalog,images:S.images,open:[],logs:[],avoid:{},target:80,plan:[]}}if(x.batches)return Object.assign(initial(),x);if(x.S&&x.S.batches)return Object.assign(initial(),x.S);throw Error('没有找到pantry或batches库存')}function importData(){let f=importFile.files[0];if(!f)return alert('请选择文件');let r=new FileReader();r.onload=()=>{try{S=normalise(JSON.parse(String(r.result).replace(/^\uFEFF/,'')));for(const id in EMBEDDED.catalog)S.catalog[id]=Object.assign(S.catalog[id]||{},EMBEDDED.catalog[id]);S.images=EMBEDDED.images;plan();render();status.textContent=`导入成功：${S.batches.length}个批次，共${groups().reduce((a,x)=>a+x.count,0)}件`}catch(err){status.textContent='导入失败：'+err.message}};r.readAsText(f)}function exportData(){let a=e('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'text/plain'}));a.download='咕噜开罐备份_'+D()+'.txt';a.click()}function restore(){if(confirm('恢复为内置197件库存？')){S=initial();plan();render();status.textContent='已恢复内置库存'}}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.p).classList.add('on')});if(!S.plan?.length)plan();render();</script></body></html>
